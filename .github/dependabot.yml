# Dependabot version updates. https://docs.github.com/code-security/dependabot
#
# GLOB TEST (2026-11-10, for the per-stack templates in wshno/devops): every ecosystem except
# github-actions finds its manifests with `directories: ["/**"]` instead of a hand-kept list, and npm is
# one block with the union of the groups (a group that matches nothing does nothing). The pip block is
# a probe: this repo has no Python, so it shows what Dependabot does with a glob that matches nothing.
# Expected: docker in /src/frontend, /tests/e2e and /.github/actions/rover-terraform-action; npm in
# /src/frontend and /tests/e2e; nuget in /src/backend (solution) or per project.

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "docker"
  directories:
  - "/**"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"

- package-ecosystem: "nuget"
  directories:
  - "/**"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    microsoft:
      patterns:
      - "Microsoft.*"
    swashbuckle:
      patterns:
      - "Swashbuckle.*"
    xunit:
      patterns:
      - "xunit"
      - "xunit.*"
    nunit:
      patterns:
      - "nunit"
      - "nunit.*"
    coverlet:
      patterns:
      - "coverlet.*"
    opentelemetry:
      patterns:
      - "OpenTelemetry.*"

- package-ecosystem: "npm"
  directories:
  - "/**"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  ignore:
  # typescript-eslint, which @wshno/eslint-config builds on, supports TypeScript <6.1. Drop this once a
  # typescript-eslint release widens that range.
  - dependency-name: "typescript"
    versions: [">=6.1"]
  groups:
    wshno:
      patterns:
      - "@wshno/*"
    types:
      patterns:
      - "@types/*"
    eslint:
      patterns:
      - "eslint"
      - "eslint-*"
      - "@eslint/*"
      - "typescript-eslint"
      - "@typescript-eslint/*"
      - "*/eslint-plugin"
      - "*/eslint-plugin-*"
    react:
      patterns:
      - "react"
      - "react-*"
      - "@types/react*"
    testing:
      patterns:
      - "@testing-library/*"
      - "vitest"
      - "@vitest/*"
      - "jsdom"
      - "msw"
    vite:
      patterns:
      - "vite"
      - "vite-*"
      - "@vitejs/*"
    tanstack:
      patterns:
      - "@tanstack/*"
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
    playwright:
      patterns:
      - "@playwright/*"
    code-quality:
      patterns:
      - "prettier"
      - "@cspell/*"
    utilities:
      patterns:
      - "dotenv"
      - "globals"

# Probe: no Python in this repo. Remove after the test.
- package-ecosystem: "pip"
  directories:
  - "/**"
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
