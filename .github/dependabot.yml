# Dependabot version updates. https://docs.github.com/code-security/dependabot
#
# GLOB TEST, round 2 (2026-11-10, for the per-stack templates in wshno/devops). Round 1 showed
# `/**` is not recursive: npm and pip failed with "/** not found", docker and nuget expanded it to the
# top-level directories only and silently checked nothing. Now single-level wildcards, one per depth:
# "/", "/*", "/*/*". Expected: docker in /src/frontend, /tests/e2e; npm in /src/frontend, /tests/e2e;
# nuget in /src/backend and /shared/NugetDistSample. Open question: are expanded directories without a
# manifest skipped (docker did in round 1) or an error?

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "docker"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"

- package-ecosystem: "nuget"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    microsoft:
      patterns:
      - "Microsoft.*"
    swashbuckle:
      patterns:
      - "Swashbuckle.*"
    xunit:
      patterns:
      - "xunit"
      - "xunit.*"
    nunit:
      patterns:
      - "nunit"
      - "nunit.*"
    coverlet:
      patterns:
      - "coverlet.*"
    opentelemetry:
      patterns:
      - "OpenTelemetry.*"

- package-ecosystem: "npm"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  ignore:
  # typescript-eslint, which @wshno/eslint-config builds on, supports TypeScript <6.1. Drop this once a
  # typescript-eslint release widens that range.
  - dependency-name: "typescript"
    versions: [">=6.1"]
  groups:
    wshno:
      patterns:
      - "@wshno/*"
    types:
      patterns:
      - "@types/*"
    eslint:
      patterns:
      - "eslint"
      - "eslint-*"
      - "@eslint/*"
      - "typescript-eslint"
      - "@typescript-eslint/*"
      - "*/eslint-plugin"
      - "*/eslint-plugin-*"
    react:
      patterns:
      - "react"
      - "react-*"
      - "@types/react*"
    testing:
      patterns:
      - "@testing-library/*"
      - "vitest"
      - "@vitest/*"
      - "jsdom"
      - "msw"
    vite:
      patterns:
      - "vite"
      - "vite-*"
      - "@vitejs/*"
    tanstack:
      patterns:
      - "@tanstack/*"
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
    playwright:
      patterns:
      - "@playwright/*"
    code-quality:
      patterns:
      - "prettier"
      - "@cspell/*"
    utilities:
      patterns:
      - "dotenv"
      - "globals"
