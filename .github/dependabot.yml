# Dependabot version updates. https://docs.github.com/code-security/dependabot
#
# Manifests are found with single-level wildcards, one per depth ("/", "/*", "/*/*"); listed or
# expanded directories without a manifest are skipped, but a block that finds none at all fails
# (dependency_file_not_found). `**` is NOT recursive (it behaves like one level). Deeper paths, like the
# composite actions under .github/actions/, are listed explicitly. Tested 2026-11-10 (#1325, #1326).

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "docker"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"

- package-ecosystem: "nuget"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    microsoft:
      patterns:
      - "Microsoft.*"
    swashbuckle:
      patterns:
      - "Swashbuckle.*"
    xunit:
      patterns:
      - "xunit"
      - "xunit.*"
    nunit:
      patterns:
      - "nunit"
      - "nunit.*"
    coverlet:
      patterns:
      - "coverlet.*"
    opentelemetry:
      patterns:
      - "OpenTelemetry.*"

- package-ecosystem: "npm"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  ignore:
  # typescript-eslint, which @wshno/eslint-config builds on, supports TypeScript <6.1. Drop this once a
  # typescript-eslint release widens that range.
  - dependency-name: "typescript"
    versions: [">=6.1"]
  groups:
    wshno:
      patterns:
      - "@wshno/*"
    types:
      patterns:
      - "@types/*"
    eslint:
      patterns:
      - "eslint"
      - "eslint-*"
      - "@eslint/*"
      - "typescript-eslint"
      - "@typescript-eslint/*"
      - "*/eslint-plugin"
      - "*/eslint-plugin-*"
    react:
      patterns:
      - "react"
      - "react-*"
      - "@types/react*"
    testing:
      patterns:
      - "@testing-library/*"
      - "vitest"
      - "@vitest/*"
      - "jsdom"
      - "msw"
    vite:
      patterns:
      - "vite"
      - "vite-*"
      - "@vitejs/*"
    tanstack:
      patterns:
      - "@tanstack/*"
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
    playwright:
      patterns:
      - "@playwright/*"
    code-quality:
      patterns:
      - "prettier"
      - "@cspell/*"
    utilities:
      patterns:
      - "dotenv"
      - "globals"
