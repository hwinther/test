# TEMPORARY (remove before merge): find out why kubeconform can't find the HTTPRoute schema on the
# runner while the same version, args and file validate locally.
name: 'TMP kubeconform debug'

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the schema the way kubeconform would
        run: |
          url='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json'
          curl -sS -D headers.txt -o body.json -w 'status=%{http_code} size=%{size_download} type=%{content_type}\n' "$url" || true
          cat headers.txt
          head -c 300 body.json; echo
          python3 -c 'import json; json.load(open("body.json")); print("body parses as JSON")' || echo "body is NOT JSON"
          echo '--- default location for comparison:'
          curl -sS -o /dev/null -w 'status=%{http_code}\n' 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/httproute-gateway-v1.json' || true
      - name: kubeconform -debug on the resolved render
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform
          kubectl kustomize deploy > render.yaml
          perl -pe 's/\$\{([A-Za-z_][A-Za-z0-9_]*)(?::?[=-]([^}]*))?\}/defined $2 ? $2 : lc($1 =~ tr|_|-|r)/ge' render.yaml > test.yaml
          ./kubeconform -debug -verbose -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            test.yaml || true
          echo '--- datree only:'
          ./kubeconform -debug -verbose -strict -summary \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            test.yaml || true
          echo '--- local copy of the schema:'
          mkdir -p schemas/gateway.networking.k8s.io && cp body.json schemas/gateway.networking.k8s.io/httproute_v1.json
          ./kubeconform -debug -verbose -strict -summary -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' test.yaml || true
