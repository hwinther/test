name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]
    paths:
      # deploy/ too: a PR labelled deploy-feature previews its manifest changes.
      - "deploy/**"
      - "src/backend/**"
      - "src/frontend/**"
      - "tests/e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pr-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "tests/e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pr-e2e.yml"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # The tag for builds of main: main-<sha7>, also used for the quality artifact below.
  main-tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: main-<sha7>
        id: tag
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Unit tests and coverage for builds of main, so quality (below) covers the whole repo. Same
  # inputs as ci.yml, which runs them on pull requests; on push pr-build tests every stack
  # rather than diffing against main.
  unit:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    secrets:
      # pr-build.yml declares only these two (both required: false; each falls back
      # to GITHUB_TOKEN when unset). GITHUB_TOKEN is auto-provided, not forwarded.
      npm_auth_token: ${{ secrets.npm_auth_token }}
      nuget_auth_token: ${{ secrets.nuget_auth_token }}
    with:
      node_enabled: true
      node_version: "26.x"
      node_working_directory: "src/frontend"
      dotnet_enabled: true
      dotnet_working_directory: "src/backend"
      dotnet_changes_regex: "^src/backend|^tests/backend"
      dotnet_solution_file: "Backend.slnx"

  # Build only. On same-repo PRs each image goes to a staging tag (pr-<N>-<sha7>) and is handed
  # on as repo@digest, so the scans, e2e and the push all use the same bytes; Dependabot PRs and
  # pushes to main fall back to a workflow artifact. prune-ghcr.yml deletes staging tags once the
  # PR is closed.
  api:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-dotnet.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      dotnet_version: 10.0.x
      solution_path: src/backend
      solution_file: Backend.slnx
      project_file: WebApi/WebApi.csproj
      container_registry: ghcr.io
      container_image_name_postfix: api

  frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: frontend
      build_context: src/frontend
      dockerfile: src/frontend/Dockerfile

  # The scans run next to e2e rather than before it.
  api-scan:
    needs: [api]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      image: ${{ needs.api.outputs.image }}
      container_image_name_postfix: api
      grype_fail_build: auto

  frontend-scan:
    needs: [frontend]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      image: ${{ needs.frontend.outputs.image }}
      container_image_name_postfix: frontend
      grype_fail_build: auto

  # The @wshno/playwright-config version the e2e image builds on: the one tests/e2e/'s lock file
  # resolves, so the image's browser matches the suite's Playwright.
  e2e-base:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      playwright_config: ${{ steps.lock.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "@wshno/playwright-config from the lock file"
        id: lock
        run: |
          set -euo pipefail
          v=$(jq -r '.packages["node_modules/@wshno/playwright-config"].version' tests/e2e/package-lock.json)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No @wshno/playwright-config version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The test runner: tests/e2e/'s specs and npm packages on @wshno/playwright-config's runner image,
  # run below as the `playwright` service of docker-compose.e2e.yml. Built and handed on like the
  # app images, so e2e needs no Node or browsers on the runner.
  e2e-image:
    needs: [e2e-base]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: e2e
      build_context: tests/e2e
      dockerfile: tests/e2e/Dockerfile
      build_args: PLAYWRIGHT_CONFIG_VERSION=${{ needs.e2e-base.outputs.playwright_config }}

  e2e:
    needs: [api, frontend, e2e-image]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      # playwright-e2e.yml fetches artifact hand-offs via `gh run download` (Actions REST API),
      # which requires actions: read on the workflow token.
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      compose_file: docker-compose.e2e.yml
      # The suite runs from the e2e image as a compose service (chromium only, as before), not with
      # Node and browsers on the runner: the same `docker compose --profile e2e run --rm playwright`
      # as locally.
      compose_playwright_service: playwright
      playwright_working_directory: tests/e2e
      # The api and SSR frontend trace to the stack's collector; API requests and SQL queries over
      # 2 s are reported in the job summary and the PR comment.
      otel_traces_file: tests/e2e/otel-out/traces.jsonl
      slow_span_threshold_ms: 2000
      report_paths_json: '["playwright-report","test-results","otel-out"]'
      image_artifacts_json: |
        {"API_IMAGE":"${{ needs.api.outputs.image }}",
         "FRONTEND_IMAGE":"${{ needs.frontend.outputs.image }}",
         "E2E_IMAGE":"${{ needs.e2e-image.outputs.image }}"}

  push-api:
    needs: [api, api-scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      artifact_name: ${{ needs.api.outputs.image }}
      container_image_tags: ${{ needs.api.outputs.container_image_tags }}
      image_digest: ${{ needs.api.outputs.image_digest }}
      version: ${{ needs.api.outputs.version }}
      sbom_artifact_name: ${{ needs.api-scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.api-scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.api-scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.api-scan.outputs.grype_json_sha256 }}

  push-frontend:
    needs: [frontend, frontend-scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: frontend
      artifact_name: ${{ needs.frontend.outputs.image }}
      container_image_tags: ${{ needs.frontend.outputs.container_image_tags }}
      image_digest: ${{ needs.frontend.outputs.image_digest }}
      version: ${{ needs.frontend.outputs.version }}
      sbom_artifact_name: ${{ needs.frontend-scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.frontend-scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.frontend-scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.frontend-scan.outputs.grype_json_sha256 }}

  # Renders the PR's deploy/ like a release, with both images that just landed in GHCR pinned to
  # tag@digest, and pushes it as the signed artifact ghcr.io/hwinther/test/manifests:pr-<N>.
  # Signed in this job, so the identity is pr-e2e.yml@refs/pull/<N>/merge: the cluster's preview
  # OCIRepository accepts only that, and the test environment only release tags.
  manifests:
    needs: [api, frontend, push-api, push-frontend]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: pr-${{ github.event.pull_request.number }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate, push and sign
        id: push
        uses: hwinther/reusable-workflows/.github/actions/manifests@baae133de5cf8489108bd7e8bed86b5fa558a846 # v2.27.1
        with:
          mode: push
          artifact: ghcr.io/hwinther/test/manifests
          tag: pr-${{ github.event.pull_request.number }}
          images: |
            ghcr.io/hwinther/test/api:${{ needs.api.outputs.version }}@${{ needs.push-api.outputs.image_digest }}
            ghcr.io/hwinther/test/frontend:${{ needs.frontend.outputs.version }}@${{ needs.push-frontend.outputs.image_digest }}
          renders: test.yaml=deploy
          # HTTPRoute (Gateway API CRD) has no built-in kubeconform schema; validate it against the datree catalog.
          kubeconform_args: "-strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

  # Deploys an ephemeral preview env to the homelab cluster via GitOps. The reusable workflow
  # mints a GitHub App installation token, clones hwinther/proxmox, renders the per-PR overlay
  # under clusters/production/apps/previews/test/, and pushes one commit. Flux reconciles within
  # ~1 min.
  #
  # Same `deploy-feature` label gate as the push-* jobs so a PR opts into push + deploy together.
  # The overlay pins the manifest artifact by digest, and the artifact pins the images.
  deploy-preview:
    needs: [manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-upsert.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/test
      pr_number: ${{ github.event.pull_request.number }}
      host: test-${{ github.event.pull_request.number }}.preview.wsh.no
      db_name: test_pr${{ github.event.pull_request.number }}
      app_name: test
      # The preview template pins the manifest artifact (which pins the images), not the images.
      image_tag: ${{ needs.manifests.outputs.tag }}
      image_digest: ${{ needs.manifests.outputs.digest }}
      client_id: ${{ vars.PROXMOX_GITOPS_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  # Single sticky PR comment with the preview URL once the GitOps commit has landed. Flux still
  # needs ~1 min to reconcile after this comment appears.
  comment-preview-url:
    needs: [deploy-preview, manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update preview-URL sticky comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test-preview-env
          message: |
            ### Preview environment

            Deployed via Flux (reconciles within ~1 min) from the signed manifest artifact
            `manifests:${{ needs.manifests.outputs.tag }}` (this PR's `deploy/`), with the images
            that just passed e2e + grype pinned by digest.

            - Preview URL: ${{ needs.deploy-preview.outputs.preview_url }}
            - Database: `test_pr${{ github.event.pull_request.number }}` on `testdb.postgres-test`

            Sign-in works for PRs in the `pxce` client's preview pool (currently 1271-1320).
            Closing the PR auto-removes the env via `pr-preview-cleanup.yml`.

  # The run's test, coverage, warning and scan results (every quality-* artifact) as the signed OCI
  # artifact ghcr.io/<owner>/<repo>/quality:main-<sha7> plus the moving :main, and as the workflow
  # artifact quality-summary that wshno/devops' repository report reads. Also runs when a test job
  # failed, so the failures are reported.
  quality:
    needs: [main-tag, unit, e2e, api-scan, frontend-scan, api, frontend]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: hwinther/reusable-workflows/.github/workflows/quality-artifact.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      tags: |
        ${{ needs.main-tag.outputs.tag }}
        main
      version: ${{ needs.api.outputs.version }}
