# One host: /api, /swagger and /hubs (SignalR) go to the API, everything else to the SSR frontend.
# The gethomepage.dev annotations are inert on clusters without homepage.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Homepage otherwise derives the link from the first path (/api); pin the frontend root.
    gethomepage.dev/href: "https://${APP_HOST}/"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: "${HOMEPAGE_NAME:=Test (repo sample)}"
    gethomepage.dev/siteMonitor: "https://${APP_HOST}"
    gethomepage.dev/icon: mdi-application-outline
    gethomepage.dev/description: Sample test app (API under /api/; Swagger under /swagger)
    # Both Deployments back this host.
    gethomepage.dev/pod-selector: app in (test-frontend, test-api)
spec:
  rules:
  - host: "${APP_HOST}"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: test-api
            port:
              number: 8080
      - path: /swagger
        pathType: Prefix
        backend:
          service:
            name: test-api
            port:
              number: 8080
      - path: /hubs
        pathType: Prefix
        backend:
          service:
            name: test-api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-frontend
            port:
              number: 8080
