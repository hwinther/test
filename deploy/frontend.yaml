# Test frontend: React Router 7 SSR server. The OIDC flow (client pxce) runs in the browser, which
# calls the API on the same host; the root loader injects PUBLIC_API_BASE_URL at runtime.
# Variables: see api.yaml and README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-frontend
  template:
    metadata:
      labels:
        app: test-frontend
        app.kubernetes.io/name: test-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: test-frontend
        image: ghcr.io/hwinther/test/frontend
        # Releases pin tag@digest, so a cached image is always the right one.
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        env:
        - name: PORT
          value: "8080"
        - name: PUBLIC_API_BASE_URL
          value: "https://${APP_HOST}"
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "https://${APP_HOST}/v1/traces"
        - name: PUBLIC_OTEL_SERVICE_NAME
          value: test-frontend
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: test-frontend-valkey
              key: redis-url
---
apiVersion: v1
kind: Service
metadata:
  name: test-frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: test-frontend
