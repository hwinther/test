# Test API (ASP.NET Core 10 Web API + EF Core on PostgreSQL, SignalR with a Redis backplane). It runs
# Database.Migrate() at startup, so a new release migrates before /healthz goes ready; each
# release's migrations must work with the previous release's code, which still serves during the
# rolling update.
#
# ${VARS} are filled in by Flux postBuild substitution in the cluster repo; `${X:=d}` has a default.
# Only substitute string values: kustomize drops the quotes, so a substituted number or boolean
# comes out as a YAML int/bool and env values must be strings.
# Every variable without a default must be listed in README.md (CI fails otherwise).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-api
  template:
    metadata:
      labels:
        app: test-api
        app.kubernetes.io/name: test-api
    spec:
      automountServiceAccountToken: false
      # Must exceed the preStop sleep (20s) plus the longest expected SignalR reconnect window.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654          # the dotnet aspnet image's `app` user ($APP_UID)
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: test-api
        image: ghcr.io/hwinther/test/api
        # Releases pin tag@digest, so a cached image is always the right one.
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: PG_HOST
          value: "${PG_HOST}"
        - name: PG_DB
          value: "${PG_DB:=api}"
        - name: PG_USER
          value: "${PG_USER}"
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "${PG_SECRET}"
              key: password
        # Npgsql accepts the URI form. The key must match Program.cs `GetConnectionString("Blogging")`.
        - name: ConnectionStrings__Blogging
          value: "postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):5432/$(PG_DB)"
        # Full redis:// URL with password; shared with the frontend.
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: test-frontend-valkey
              key: redis-url
        - name: OTEL_SERVICE_NAME
          value: test-api
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=$(POD_NAMESPACE),deployment.environment=${APP_ENVIRONMENT:=test}"
        - name: RabbitMq__HostName
          value: "${RABBITMQ_HOST}"
        - name: RabbitMq__Port
          value: "5672"
        - name: RabbitMq__VirtualHost
          value: "${RABBITMQ_VHOST}"
        - name: RabbitMq__UserName
          valueFrom:
            secretKeyRef:
              name: "${RABBITMQ_SECRET}"
              key: username
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: "${RABBITMQ_SECRET}"
              key: password
        # Authelia issues RFC 9068 JWTs with aud=pxce-api for the pxce client.
        - name: Oidc__Authority
          value: "${OIDC_AUTHORITY}"
        - name: Oidc__Audience
          value: "${OIDC_AUDIENCE:=pxce-api}"
        # The browser calls the API on the same host, so only that origin.
        - name: Cors__AllowedOrigins__0
          value: "https://${APP_HOST}"
        # Point OpenSSL (and so .NET SslStream / RabbitMQ.Client AMQPS) at the internal CA bundle, so
        # the broker's self-signed certificate verifies.
        - name: SSL_CERT_FILE
          value: /etc/ssl/wsh/ca-bundle.crt
        - name: SSL_CERT_DIR
          value: /etc/ssl/wsh
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # /healthz waits for the database (after migrations) and the Redis backplane.
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        # SignalR keeps long-lived WebSockets: stay in Terminating long enough for Traefik to stop
        # routing new connections here before the process exits.
        lifecycle:
          preStop:
            sleep:
              seconds: 20
        volumeMounts:
        - name: wsh-ca-bundle
          mountPath: /etc/ssl/wsh
          readOnly: true
      volumes:
      - name: wsh-ca-bundle
        configMap:
          name: wsh-internal-ca
          items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
---
apiVersion: v1
kind: Service
metadata:
  name: test-api
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: test-api
